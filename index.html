<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Crypto Visual Lab</title>
<style>
:root{--bg:#f4f0e8;--fg:#1c1d22;--mut:#6b6860;--card:#fff;--ln:#ddd8cc;--ac:#b8691f;--ok:#2e7d4f;--bad:#b94a3e;--c1:#e8a33d;--c2:#4c9f6b;--c3:#5b7fd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d22;--fg:#f4f0e8;--mut:#9a9aa5;--card:#26272e;--ln:#3a3b44;--ac:#e8a33d;--ok:#6fcf97;--bad:#ff8a7a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Calibri,Segoe UI,sans-serif}
main{max-width:860px;margin:auto;padding:16px}
h1{font:700 28px Georgia,serif;margin:.2em 0}h2{font:700 20px Georgia,serif;margin:0 0 4px}
p{color:var(--mut);margin:.3em 0}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
nav button{white-space:nowrap;background:var(--card);color:var(--fg);border:1px solid var(--ln)}
nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
button{font:inherit;font-weight:700;padding:7px 12px;border-radius:6px;border:0;background:var(--ac);color:var(--bg);cursor:pointer;margin:4px 4px 0 0}
input,select{font:inherit;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--fg);width:100%;box-sizing:border-box}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:14px;margin:12px 0}
.k{font:700 11px Consolas,monospace;letter-spacing:.14em;color:var(--ac);margin:10px 0 4px}
.m{font:13px Consolas,monospace;word-break:break-all}
.cells{display:flex;flex-wrap:wrap;gap:3px}
.c{min-width:26px;padding:4px 3px;text-align:center;font:13px Consolas,monospace;border-radius:4px;background:var(--bg);border:1px solid var(--ln)}
.c small{display:block;font-size:9px;color:var(--mut)}
.arr{text-align:center;color:var(--ac);font-weight:700;margin:4px 0}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
.g{display:grid;grid-template-columns:repeat(4,38px);gap:3px}.g .c{min-width:0;padding:8px 0}
.flex{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.box{border:1px solid var(--ln);border-radius:6px;padding:8px 10px;background:var(--bg)}
.sw{display:inline-block;width:100%;height:14px}
</style></head><body><main>
<div class="k">COMP3143 · WEEK 7</div><h1>Crypto Visual Lab</h1>
<p>Type your own text. Watch exactly what each tool does to it, step by step. Runs in your browser only (real WebCrypto, toy math where marked).</p>
<nav id="nav"></nav>
<div class="card"><h2 id="tt"></h2><p id="td"></p><div id="in"></div><div id="v"></div></div>
<script>
const $=i=>document.getElementById(i),E=new TextEncoder(),hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''),un=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const sha=async s=>hx(await crypto.subtle.digest('SHA-256',typeof s=='string'?E.encode(s):s));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const col=h=>`hsl(${parseInt(h,16)*22.5},60%,${matchMedia('(prefers-color-scheme:dark)').matches?'30%':'80%'})`;
const cells=(h,w=2,diff)=>'<div class="cells">'+(h.match(new RegExp('.{1,'+w+'}','g'))||[]).map((x,i)=>`<div class="c" style="background:${diff&&diff[i]?'var(--bad);color:#fff':col(x[0])}">${x}</div>`).join('')+'</div>';
const k=t=>`<div class="k">${t}</div>`,arr='<div class="arr">▼</div>';
const inp=(id,v,l,t='text')=>`<label class="m">${l}</label><input id="${id}" type="${t}" value="${v}" oninput="go()">`;
const val=i=>$(i).value;
function sh(t,n){return t.replace(/[a-z]/gi,c=>{const b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+n+26)%26+b)})}
const gcd=(a,b)=>b?gcd(b,a%b):a,pw=(b,e,m)=>{let r=1n;b%=m;while(e>0n){if(e&1n)r=r*b%m;b=b*b%m;e>>=1n}return r};
const T={};
T.caesar={n:'1 Caesar',d:'Each letter moves k places along the alphabet. Only 25 keys exist, so brute force wins.',i:()=>inp('a','ATTACK AT DAWN','Plaintext')+inp('b',3,'Key k (1-25)','number'),
r:async()=>{const t=val('a'),n=+val('b')||0,A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let o=k('ALPHABET SHIFT (top = plain, bottom = cipher)')+'<div class="m">'+A+'<br>'+sh(A,n)+'</div>'+k('LETTER BY LETTER')+'<div class="cells">'+[...t].map(c=>/[a-z]/i.test(c)?`<div class="c">${c.toUpperCase()}<small>↓${n}</small>${sh(c,n).toUpperCase()}</div>`:`<div class="c">${esc(c)}<small> </small>${esc(c)}</div>`).join('')+'</div>'+k('BRUTE FORCE: ALL 25 KEYS')+'<div class="m">';const c=sh(t,n);for(let i=1;i<26;i++){const x=sh(c,-i);o+=(i==n?'<span class="ok">':'<span>')+'k='+String(i).padStart(2)+' '+esc(x)+(i==n?' ← readable</span>':'</span>')+'<br>'}return o+'</div>'}};
T.sha={n:'2 SHA-256',d:'Any input becomes a fixed 256-bit fingerprint. Edit the second box by one character: the hash changes completely (avalanche).',i:()=>inp('a','hello world','Input A')+inp('b','hello world!','Input B (almost the same)'),
r:async()=>{const a=await sha(val('a')),b=await sha(val('b'));const d=[...a].map((c,i)=>c!=b[i]);const n=d.filter(x=>x).length;const bits=(x,y)=>{let c=0;for(let i=0;i<64;i++){let v=parseInt(x[i],16)^parseInt(y[i],16);while(v){c+=v&1;v>>=1}}return c};return k('INPUT A → HASH')+cells(a,2)+k('INPUT B → HASH (red = different digit)')+cells(b,2,d.reduce((o,x,i)=>(o[Math.floor(i/2)]=o[Math.floor(i/2)]||x,o),[]))+`<p><b>${n}</b> of 64 hex digits differ, <b>${bits(a,b)}</b> of 256 bits flipped (about half = avalanche).</p><p>Length is always 64 hex digits, even for 1 letter or a whole book. There is no way back.</p>`}};
T.salt={n:'3 Salting',d:'Add a random salt before hashing. Same password, different salt, completely different stored hash.',i:()=>inp('a','password123','Password')+'<button onclick="go()">New random salts</button>',
r:async()=>{const p=val('a'),r=()=>hx(crypto.getRandomValues(new Uint8Array(4))),s1=r(),s2=r();const row=async(u,s)=>`<div class="box" style="margin:6px 0"><b>${u}</b>: salt <span class="m" style="color:var(--c1)">${s}</span> + <span class="m">${esc(p)}</span><div class="arr">▼ SHA-256</div>${cells(await sha(s+p),2)}</div>`;return k('NO SALT (both users identical, one rainbow table cracks both)')+cells(await sha(p),2)+cells(await sha(p),2)+k('WITH SALT')+await row('Dana',s1)+await row('Sam',s2)+'<p>Salt is stored next to the hash. It is not secret, just unique.</p>'}};
T.hmac={n:'4 HMAC',d:'Hash mixed with a shared secret. Attacker edits the message, cannot recompute the tag.',i:()=>inp('a','shared-secret','Secret key')+inp('b','transfer 500 to acct 4417','Sender message')+inp('c','transfer 5000 to acct 4417','Message received (attacker may edit)'),
r:async()=>{const mac=async(kk,m)=>{const y=await crypto.subtle.importKey('raw',E.encode(kk),{name:'HMAC',hash:'SHA-256'},false,['sign']);return hx(await crypto.subtle.sign('HMAC',y,E.encode(m)))};const t1=await mac(val('a'),val('b')),t2=await mac(val('a'),val('c')),plain=await sha(val('c'));return k('SENDER TAG = HMAC(key, message)')+cells(t1,2)+k('RECEIVER RECOMPUTES ON WHAT ARRIVED')+cells(t2,2)+`<p>${t1==t2?'<span class="ok">✓ tags match: message authentic</span>':'<span class="bad">✗ mismatch: message changed, reject</span>'}</p>`+k('ATTACKER ONLY KNOWS PLAIN SHA-256 OF THE EDIT (no key, cannot forge)')+cells(plain,2)}};
T.des={n:'5 DES (toy)',d:'DES splits a block into left/right halves and mixes them over 16 rounds (Feistel). This toy uses 8 rounds and a tiny key to show the idea. Real DES: 56-bit key, now cracked.',i:()=>inp('a','HELLO!!!','8-character block')+inp('b','secret','Key text'),
r:async()=>{let b=[...(val('a')+'        ').slice(0,8)].map(c=>c.charCodeAt(0)&255),L=b.slice(0,4).reduce((x,y)=>(x<<8|y)>>>0,0),R=b.slice(4).reduce((x,y)=>(x<<8|y)>>>0,0);const kk=[...val('b')].reduce((x,c)=>(x*31+c.charCodeAt(0))>>>0,7);let o=k('START')+`<div class="m">L=${L.toString(16).padStart(8,'0')}  R=${R.toString(16).padStart(8,'0')}</div>`+k('ROUNDS: newL = R, newR = L XOR f(R, roundkey)');for(let i=0;i<8;i++){const rk=(Math.imul(kk,i+1)^(kk>>>i))>>>0,f=((Math.imul(R,rk|1)>>>0)^(R>>>5))>>>0,nr=(L^f)>>>0;L=R;R=nr;o+=`<div class="m">round ${i+1}: L=<span style="color:var(--c1)">${L.toString(16).padStart(8,'0')}</span> R=<span style="color:var(--c3)">${R.toString(16).padStart(8,'0')}</span></div>`}return o+k('CIPHERTEXT (64 bits)')+cells(L.toString(16).padStart(8,'0')+R.toString(16).padStart(8,'0'),2)+'<p>Because each round is reversible, decryption just runs the same rounds with keys in reverse order.</p>'}};
T.aes={n:'6 AES-256-GCM',d:'Real AES. Your text becomes bytes, then a 4×4 byte grid per 16-byte block is scrambled by the key. Wrong key = fails.',i:()=>inp('a','meet at noon','Plaintext')+inp('b','key-one','Password (key is derived from this)')+inp('c','key-two','Password to try decrypting with'),
r:async()=>{const m=await crypto.subtle.importKey('raw',E.encode(val('b')),'PBKDF2',false,['deriveKey']),s=new Uint8Array(16),iv=crypto.getRandomValues(new Uint8Array(12)),dk=async p=>crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:50000,hash:'SHA-256'},await crypto.subtle.importKey('raw',E.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);const key=await dk(val('b')),pt=E.encode(val('a')),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,pt));const blk=u=>{const x=new Uint8Array(16);x.set(u.slice(0,16));return '<div class="g">'+[...x].map(v=>`<div class="c" style="background:${col(v.toString(16).padStart(2,'0')[0])}">${v.toString(16).padStart(2,'0')}</div>`).join('')+'</div>'};let ok;try{await crypto.subtle.decrypt({name:'AES-GCM',iv},await dk(val('c')),ct);ok=1}catch(e){ok=0}return k('PLAINTEXT BYTES (first block, 4×4 state)')+'<div class="flex">'+blk(pt)+'<b>→ AES rounds + key →</b>'+blk(ct)+'</div>'+k('FULL CIPHERTEXT + AUTH TAG')+cells(hx(ct),2)+k('IV (random each time)')+'<div class="m">'+hx(iv)+'</div>'+`<p>Decrypt with “${esc(val('c'))}”: ${ok?'<span class="ok">✓ works (same key)</span>':'<span class="bad">✗ fails (wrong key)</span>'}</p><p>Encrypt again and the ciphertext changes, because the IV is random.</p>`}};
T.rsa={n:'7 RSA (toy)',d:'Each character code is turned into a number, raised to e mod n. Real RSA uses 2048-bit n; this uses tiny primes so you can follow the math.',i:()=>inp('a','Hi!','Plaintext')+'<div class="row"><select id="p" onchange="go()"><option>61</option><option>67</option><option>71</option></select><select id="q" onchange="go()"><option>53</option><option>59</option><option>73</option></select></div>',
r:async()=>{const p=BigInt(val('p')),q=BigInt(val('q')),n=p*q,t=(p-1n)*(q-1n);let e=17n;while(gcd(e,t)!=1n)e+=2n;let d=1n;while(e*d%t!=1n)d++;const cs=[...val('a')].map(c=>BigInt(c.charCodeAt(0)&255)),en=cs.map(m=>pw(m,e,n)),de=en.map(c=>pw(c,d,n));return k('KEY GENERATION')+`<div class="m">p=${p}, q=${q} (secret)<br>n = p×q = ${n} (public)<br>φ = (p−1)(q−1) = ${t}<br>public key (n=${n}, e=${e})<br>private key (n=${n}, d=${d})</div>`+k('ENCRYPT: c = m^e mod n')+'<div class="cells">'+cs.map((m,i)=>`<div class="c">${String.fromCharCode(Number(m))}<small>${m}</small>${en[i]}</div>`).join('')+'</div>'+k('DECRYPT: m = c^d mod n')+'<div class="cells">'+de.map((m,i)=>`<div class="c">${en[i]}<small>→</small>${m} ${String.fromCharCode(Number(m))}</div>`).join('')+'</div><p>Without p and q, finding d means factoring n. Trivial here, impossible at 2048 bits.</p>'}};
let ek=null;async function ecKey(){return ek=ek||await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify'])}
T.sig={n:'8 Signature',d:'Real ECDSA. Alice signs the hash of her message with her private key. Bob verifies with her public key. Change one letter: it fails.',i:()=>inp('a','Pay Sam 500','Alice signs this')+inp('b','Pay Sam 500','Bob received this (try editing)'),
r:async()=>{const K=await ecKey(),sg=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},K.privateKey,E.encode(val('a'))),v=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},K.publicKey,sg,E.encode(val('b')));return k('1 HASH OF MESSAGE')+cells(await sha(val('a')),2)+arr+k('2 SIGN HASH WITH PRIVATE KEY')+cells(hx(sg),2)+arr+k('3 BOB RE-HASHES WHAT HE GOT')+cells(await sha(val('b')),2)+arr+`<p>${v?'<span class="ok">✓ valid: author held the private key, message unchanged</span>':'<span class="bad">✗ invalid: message altered or wrong signer</span>'}</p>`}};
let ca=null;T.pki={n:'9 PKI / Cert',d:'A CA signs “this key belongs to this domain”. The browser checks that signature, the name and the date. Edit the domain you visit to see it fail.',i:()=>inp('a','bank.example','Domain on the certificate')+inp('b','bank.example','Domain you typed in the browser')+'<select id="x" onchange="go()"><option value="0">Certificate valid</option><option value="1">Expired certificate</option></select>',
r:async()=>{ca=ca||await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const K=await ecKey(),pub=hx(await crypto.subtle.exportKey('raw',K.publicKey)),cert=JSON.stringify({d:val('a'),key:pub.slice(0,24),exp:val('x')=='1'?'2020-01-01':'2030-01-01'}),sg=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},ca.privateKey,E.encode(cert)),s1=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},ca.publicKey,sg,E.encode(cert)),s2=val('a')==val('b'),s3=JSON.parse(cert).exp>new Date().toISOString().slice(0,10),f=x=>x?'<span class="ok">✓ pass</span>':'<span class="bad">✗ fail</span>';return k('ROOT CA (trusted, built into browser)')+'<div class="box">signs ↓ with its private key</div>'+k('SITE CERTIFICATE')+`<div class="box m">${esc(cert)}</div><div class="m">CA signature: ${hx(sg).slice(0,48)}…</div>`+k('BROWSER CHECKS')+`<div class="m">1 CA signature valid? ${f(s1)}<br>2 name matches “${esc(val('b'))}”? ${f(s2)}<br>3 not expired? ${f(s3)}</div><p>${s1&&s2&&s3?'<span class="ok">🔒 padlock shown</span>':'<span class="bad">⚠ warning page</span>'}</p><p>The padlock only proves the key matches the domain, not that the site is honest.</p>`}};
T.hyb={n:'10 Hybrid',d:'Real RSA-2048 + AES-256. RSA protects only a small random AES key. AES encrypts the message. This is HTTPS in miniature.',i:()=>inp('a','Send me the project files','Message'),
r:async()=>{const R=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']),A=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),raw=await crypto.subtle.exportKey('raw',A),w=await crypto.subtle.encrypt('RSA-OAEP'.length?{name:'RSA-OAEP'}:0,R.publicKey,raw),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},A,E.encode(val('a'))),un2=await crypto.subtle.decrypt({name:'RSA-OAEP'},R.privateKey,w),A2=await crypto.subtle.importKey('raw',un2,'AES-GCM',false,['decrypt']),pt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},A2,ct));return k('1 CLIENT MAKES RANDOM AES KEY (32 bytes)')+cells(hx(raw),2)+arr+k('2 RSA ENCRYPTS ONLY THAT KEY WITH SERVER PUBLIC KEY ('+w.byteLength+' bytes)')+`<div class="m">${hx(w).slice(0,96)}…</div>`+arr+k('3 AES ENCRYPTS THE REAL MESSAGE (fast)')+cells(hx(ct),2)+arr+k('4 SERVER: PRIVATE KEY RECOVERS AES KEY → AES DECRYPTS')+`<div class="ok">“${esc(pt)}”</div>`}};
let cur='caesar';const nav=$('nav');Object.keys(T).forEach(x=>{const b=document.createElement('button');b.textContent=T[x].n;b.id='b_'+x;b.onclick=()=>{cur=x;ek=null;show()};nav.appendChild(b)});
function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='b_'+cur));$('tt').textContent=T[cur].n;$('td').textContent=T[cur].d;$('in').innerHTML=T[cur].i();go()}
let busy=0;async function go(){const c=cur;try{const h=await T[c].r();if(c==cur)$('v').innerHTML=h}catch(e){$('v').innerHTML='<p class="bad">Error: '+esc(e.message)+'</p>'}}
show();
</script></main></body></html>
